[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basira-ai"
version = "0.1.0"
description = "BASIRA AI — universal multimodal accessibility intelligence (desktop-first)"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }

[tool.setuptools.packages.find]
include = ["basira*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
